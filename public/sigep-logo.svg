<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 50 380 410" width="100%" height="100%">
  <defs>
    <!-- Gradientes 3D para os Edifícios Modernos -->
    <linearGradient id="tower1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="tower2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="tower3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="35%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Gradiente dourado para letras -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Gradiente verde para letra S -->
    <linearGradient id="greenTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Gradiente vermelho para letra I -->
    <linearGradient id="redTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Sombra para a caixa do G -->
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Brilho sutil para os arcos orbitais -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Sombra 3D para as letras -->
    <filter id="textDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- BUILDINGS (3 Torres Modernas em Estilo Corporativo/Acadêmico 3D) -->
  <g id="buildings" filter="url(#cardShadow)">
    <!-- Torre 1 (Esquerda - Baixa) -->
    <polygon points="145,175 175,166 175,255 145,255" fill="url(#tower1Grad)" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="147" y1="175" x2="147" y2="253" stroke="#7dd3fc" stroke-width="1" opacity="0.8" />
    <rect x="151" y="195" width="6" height="2.5" rx="0.5" fill="#ffffff" opacity="0.95" />
    <rect x="163" y="215" width="6" height="2.5" rx="0.5" fill="#ffffff" opacity="0.95" />
    <rect x="151" y="235" width="6" height="2.5" rx="0.5" fill="#bae6fd" opacity="0.9" />

    <!-- Torre 2 (Centro - Média) -->
    <polygon points="185,128 218,118 218,255 185,255" fill="url(#tower2Grad)" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="187" y1="128" x2="187" y2="253" stroke="#ffffff" stroke-width="1" opacity="0.8" />
    <rect x="191" y="145" width="7" height="2.5" rx="0.5" fill="#ffffff" opacity="0.95" />
    <rect x="204" y="168" width="7" height="2.5" rx="0.5" fill="#ffffff" opacity="0.95" />
    <rect x="191" y="192" width="7" height="2.5" rx="0.5" fill="#ffffff" opacity="0.9" />
    <rect x="204" y="218" width="7" height="2.5" rx="0.5" fill="#bae6fd" opacity="0.85" />

    <!-- Torre 3 (Direita - Alta) -->
    <polygon points="228,76 262,64 262,255 228,255" fill="url(#tower3Grad)" stroke="#7dd3fc" stroke-width="1.5" />
    <line x1="230" y1="76" x2="230" y2="253" stroke="#ffffff" stroke-width="1.2" opacity="0.9" />
    <rect x="234" y="98" width="7" height="2.5" rx="0.5" fill="#ffffff" opacity="0.95" />
    <rect x="247" y="125" width="7" height="2.5" rx="0.5" fill="#ffffff" opacity="0.95" />
    <rect x="234" y="152" width="7" height="2.5" rx="0.5" fill="#ffffff" opacity="0.9" />
    <rect x="247" y="180" width="7" height="2.5" rx="0.5" fill="#bae6fd" opacity="0.85" />
    <rect x="234" y="210" width="7" height="2.5" rx="0.5" fill="#bae6fd" opacity="0.85" />
  </g>

  <!-- DYNAMIC SWOOSH / ORBITAL SPEED RIBBON -->
  <g id="swoosh-ribbon" filter="url(#softGlow)">
    <!-- 1. Outer Red Ribbon -->
    <path d="M 270 85 
             C 385 82, 452 135, 442 205
             C 432 270, 360 306, 260 310
             C 180 314, 120 307, 85 298
             C 160 318, 270 318, 350 292
             C 415 258, 436 195, 395 130
             C 362 82, 290 84, 270 85 Z"
          fill="#ef4444" />

    <!-- 2. Middle White Ribbon -->
    <path d="M 266 96 
             C 365 96, 426 142, 418 205
             C 410 260, 342 294, 248 297
             C 175 300, 115 292, 92 286
             C 155 299, 252 299, 325 277
             C 385 248, 404 195, 368 140
             C 340 102, 282 96, 266 96 Z"
          fill="#ffffff" />

    <!-- 3. Inner Green Ribbon -->
    <path d="M 264 108 
             C 345 110, 400 150, 392 204
             C 385 250, 322 282, 235 284
             C 170 286, 115 280, 102 275
             C 150 286, 240 285, 305 264
             C 360 236, 375 190, 342 146
             C 318 116, 276 108, 264 108 Z"
          fill="#22c55e" />

    <!-- 4. Lower speed streaks (Purple & Amber/Gold under-trails) -->
    <!-- Violet/Deep Indigo streak -->
    <path d="M 125 284 C 180 291, 260 290, 320 274 C 265 283, 195 284, 138 280 Z"
          fill="#6366f1" opacity="0.95" />

    <!-- Amber / Gold streak -->
    <path d="M 105 292 C 165 301, 250 301, 310 285 C 255 294, 180 294, 118 287 Z"
          fill="#fbbf24" opacity="0.95" />

    <!-- White fine speed trail -->
    <path d="M 90 295 C 150 305, 230 305, 290 293 C 235 300, 160 300, 100 292 Z"
          fill="#ffffff" opacity="0.9" />
  </g>

  <!-- SIGEP WORDMARK (Tipografia 3D Em Relevo) -->
  <g id="sigep-wordmark" transform="translate(0, 30)" filter="url(#textDepth)">
    <!-- S (Green 3D) -->
    <text x="115" y="420" 
          font-family="'Bookman Old Style', 'Bookman', Georgia, serif" 
          font-size="82" 
          font-weight="900" 
          fill="url(#greenTextGrad)" 
          stroke="#14532d"
          stroke-width="1.5"
          text-anchor="middle">S</text>

    <!-- I (Red 3D) -->
    <text x="165" y="420" 
          font-family="'Bookman Old Style', 'Bookman', Georgia, serif" 
          font-size="82" 
          font-weight="900" 
          fill="url(#redTextGrad)" 
          stroke="#7f1d1d"
          stroke-width="1.5"
          text-anchor="middle">I</text>

    <!-- G Container (Cartão Branco com Borda e Sombra) -->
    <rect x="195" y="348" width="82" height="88" rx="16" 
          fill="#ffffff" 
          stroke="#e2e8f0"
          stroke-width="2"
          filter="url(#cardShadow)" />

    <!-- G (Pure Black com Efeito Relevo) inside White Container -->
    <text x="236" y="418" 
          font-family="'Bookman Old Style', 'Bookman', Georgia, serif" 
          font-size="78" 
          font-weight="900" 
          fill="#0f172a" 
          text-anchor="middle">G</text>

    <!-- E (Golden Amber 3D) -->
    <text x="315" y="420" 
          font-family="'Bookman Old Style', 'Bookman', Georgia, serif" 
          font-size="82" 
          font-weight="900" 
          fill="url(#goldTextGrad)" 
          stroke="#78350f"
          stroke-width="1.5"
          text-anchor="middle">E</text>

    <!-- P (Golden Amber 3D) -->
    <text x="375" y="420" 
          font-family="'Bookman Old Style', 'Bookman', Georgia, serif" 
          font-size="82" 
          font-weight="900" 
          fill="url(#goldTextGrad)" 
          stroke="#78350f"
          stroke-width="1.5"
          text-anchor="middle">P</text>
  </g>
</svg>

