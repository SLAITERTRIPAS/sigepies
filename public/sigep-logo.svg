<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="sigepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070e24" />
      <stop offset="50%" stop-color="#0a1435" />
      <stop offset="100%" stop-color="#050a1a" />
    </linearGradient>

    <!-- Subtle vertical grid pattern for tech background -->
    <pattern id="gridLines" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="10" cy="10" r="0.8" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Drop shadow for the G card -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Glow for the swoosh -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="500" height="500" rx="36" fill="url(#sigepBg)" />
  <rect width="500" height="500" rx="36" fill="url(#gridLines)" />

  <!-- BUILDINGS (3 stylized towers) -->
  <g id="buildings">
    <!-- Building 1 (Left - Shortest) -->
    <polygon points="145,175 175,166 175,255 145,255" fill="#151e2f" stroke="#1e2d4a" stroke-width="1.5" />
    <!-- Highlights & window dashes -->
    <line x1="147" y1="175" x2="147" y2="253" stroke="#2c3e66" stroke-width="1.2" />
    <rect x="151" y="195" width="6" height="2" rx="0.5" fill="#38bdf8" opacity="0.85" />
    <rect x="163" y="215" width="6" height="2" rx="0.5" fill="#38bdf8" opacity="0.85" />
    <rect x="151" y="235" width="6" height="2" rx="0.5" fill="#38bdf8" opacity="0.75" />

    <!-- Building 2 (Middle) -->
    <polygon points="185,128 218,118 218,255 185,255" fill="#111827" stroke="#1f293d" stroke-width="1.5" />
    <line x1="187" y1="128" x2="187" y2="253" stroke="#24324f" stroke-width="1.2" />
    <rect x="191" y="145" width="7" height="2.2" rx="0.5" fill="#38bdf8" opacity="0.85" />
    <rect x="204" y="168" width="7" height="2.2" rx="0.5" fill="#38bdf8" opacity="0.85" />
    <rect x="191" y="192" width="7" height="2.2" rx="0.5" fill="#38bdf8" opacity="0.8" />
    <rect x="204" y="218" width="7" height="2.2" rx="0.5" fill="#38bdf8" opacity="0.75" />

    <!-- Building 3 (Right - Tallest) -->
    <polygon points="228,76 262,64 262,255 228,255" fill="#0d1322" stroke="#1b2438" stroke-width="1.5" />
    <line x1="230" y1="76" x2="230" y2="253" stroke="#23324e" stroke-width="1.2" />
    <rect x="234" y="98" width="7" height="2.2" rx="0.5" fill="#38bdf8" opacity="0.85" />
    <rect x="247" y="125" width="7" height="2.2" rx="0.5" fill="#38bdf8" opacity="0.85" />
    <rect x="234" y="152" width="7" height="2.2" rx="0.5" fill="#38bdf8" opacity="0.8" />
    <rect x="247" y="180" width="7" height="2.2" rx="0.5" fill="#38bdf8" opacity="0.75" />
    <rect x="234" y="210" width="7" height="2.2" rx="0.5" fill="#38bdf8" opacity="0.7" />
  </g>

  <!-- DYNAMIC SWOOSH / ORBITAL SPEED RIBBON -->
  <!-- Sweeps from top-right of tallest building, loops wide to the right (like a letter 'D'), then sweeps under all buildings -->
  <g id="swoosh-ribbon" filter="url(#softGlow)">
    <!-- 1. Outer Red Ribbon -->
    <path d="M 270 85 
             C 385 82, 452 135, 442 205
             C 432 270, 360 306, 260 310
             C 180 314, 120 307, 85 298
             C 160 318, 270 318, 350 292
             C 415 258, 436 195, 395 130
             C 362 82, 290 84, 270 85 Z"
          fill="#dc2626" />

    <!-- 2. Middle White Ribbon -->
    <path d="M 266 96 
             C 365 96, 426 142, 418 205
             C 410 260, 342 294, 248 297
             C 175 300, 115 292, 92 286
             C 155 299, 252 299, 325 277
             C 385 248, 404 195, 368 140
             C 340 102, 282 96, 266 96 Z"
          fill="#ffffff" />

    <!-- 3. Inner Green Ribbon -->
    <path d="M 264 108 
             C 345 110, 400 150, 392 204
             C 385 250, 322 282, 235 284
             C 170 286, 115 280, 102 275
             C 150 286, 240 285, 305 264
             C 360 236, 375 190, 342 146
             C 318 116, 276 108, 264 108 Z"
          fill="#16a34a" />

    <!-- 4. Lower speed streaks (Purple & Amber/Gold under-trails) -->
    <!-- Violet/Deep Indigo streak -->
    <path d="M 125 284 C 180 291, 260 290, 320 274 C 265 283, 195 284, 138 280 Z"
          fill="#4338ca" opacity="0.9" />

    <!-- Amber / Gold streak -->
    <path d="M 105 292 C 165 301, 250 301, 310 285 C 255 294, 180 294, 118 287 Z"
          fill="#f59e0b" opacity="0.95" />

    <!-- White fine speed trail -->
    <path d="M 90 295 C 150 305, 230 305, 290 293 C 235 300, 160 300, 100 292 Z"
          fill="#ffffff" opacity="0.8" />
  </g>

  <!-- SIGEP WORDMARK -->
  <g id="sigep-wordmark" transform="translate(0, 30)">
    <!-- S (Green) -->
    <text x="115" y="420" 
          font-family="'Bookman Old Style', 'Bookman', Georgia, serif" 
          font-size="82" 
          font-weight="900" 
          fill="#16a34a" 
          text-anchor="middle">S</text>

    <!-- I (Red) -->
    <text x="165" y="420" 
          font-family="'Bookman Old Style', 'Bookman', Georgia, serif" 
          font-size="82" 
          font-weight="900" 
          fill="#dc2626" 
          text-anchor="middle">I</text>

    <!-- G Container (White rounded card with subtle shadow) -->
    <rect x="195" y="348" width="82" height="88" rx="16" 
          fill="#ffffff" 
          filter="url(#cardShadow)" />

    <!-- G (Pure Black) inside White Container -->
    <text x="236" y="418" 
          font-family="'Bookman Old Style', 'Bookman', Georgia, serif" 
          font-size="78" 
          font-weight="900" 
          fill="#050505" 
          text-anchor="middle">G</text>

    <!-- E (Golden Amber) -->
    <text x="315" y="420" 
          font-family="'Bookman Old Style', 'Bookman', Georgia, serif" 
          font-size="82" 
          font-weight="900" 
          fill="#eab308" 
          text-anchor="middle">E</text>

    <!-- P (Golden Amber) -->
    <text x="375" y="420" 
          font-family="'Bookman Old Style', 'Bookman', Georgia, serif" 
          font-size="82" 
          font-weight="900" 
          fill="#eab308" 
          text-anchor="middle">P</text>
  </g>
</svg>
