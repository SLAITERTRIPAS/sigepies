<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Left Side: Red Flag & Gear Emblem -->
  <g filter="url(#shadow)">
    <!-- Wavy Red Flag Base -->
    <path d="M 40 60 Q 90 40 140 60 Q 180 80 190 60 L 190 220 Q 140 240 90 220 Q 60 205 40 225 Z" fill="url(#flagGrad)"/>
    
    <!-- Gear in grey -->
    <g transform="translate(115, 140)">
      <circle cx="0" cy="0" r="46" fill="#64748b" opacity="0.9"/>
      <!-- Cog teeth -->
      <path d="M -8 -58 L 8 -58 L 6 -46 L -6 -46 Z" fill="#64748b"/>
      <path d="M -8 58 L 8 58 L 6 46 L -6 46 Z" fill="#64748b"/>
      <path d="M -58 -8 L -58 8 L -46 6 L -46 -6 Z" fill="#64748b"/>
      <path d="M 58 -8 L 58 8 L 46 6 L 46 -6 Z" fill="#64748b"/>
      <path d="M -42 -42 L -30 -54 L -23 -44 L -34 -34 Z" fill="#64748b"/>
      <path d="M 42 42 L 30 54 L 23 44 L 34 34 Z" fill="#64748b"/>
      <path d="M -42 42 L -54 30 L -44 23 L -34 34 Z" fill="#64748b"/>
      <path d="M 42 -42 L 54 -30 L 44 -23 L 34 -34 Z" fill="#64748b"/>
      
      <!-- Inner orange core with atomic ring -->
      <circle cx="0" cy="0" r="32" fill="#ea580c"/>
      <ellipse cx="0" cy="0" rx="26" ry="10" fill="none" stroke="#fef08a" stroke-width="2.5" transform="rotate(30)"/>
      <ellipse cx="0" cy="0" rx="26" ry="10" fill="none" stroke="#fef08a" stroke-width="2.5" transform="rotate(-30)"/>
      <circle cx="0" cy="0" r="5" fill="#fef08a"/>
      <circle cx="-16" cy="-8" r="4" fill="#fef08a"/>
      <circle cx="16" cy="8" r="4" fill="#fef08a"/>
    </g>
  </g>

  <!-- Right Side: Dark Blue Wing & ISPS text -->
  <g filter="url(#shadow)">
    <!-- Main blue quadrant with sharp upward wing curves -->
    <path d="M 205 60 L 205 220 L 225 220 Q 235 150 295 110 L 295 85 Q 240 100 205 60 Z" fill="url(#blueGrad)"/>
    
    <!-- Wing Feathers pointing up -->
    <path d="M 220 220 Q 250 160 330 115 L 345 130 Q 270 175 235 220 Z" fill="url(#blueGrad)"/>
    <path d="M 245 220 Q 285 180 355 145 L 365 160 Q 300 195 260 220 Z" fill="url(#blueGrad)"/>
    
    <!-- Gold / Yellow accent bar beneath wing -->
    <path d="M 220 220 Q 270 175 355 145 L 358 152 Q 275 182 225 224 Z" fill="url(#goldGrad)"/>

    <!-- Text: ISPS -->
    <text x="285" y="222" font-family="'Times New Roman', Times, serif" font-size="44" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="2">ISPS</text>
  </g>
</svg>
